name: Release Zarf Package
description: Reusable actions release for zarf package
inputs:
  github_token:
    description: github token
    required: true
runs:
  using: composite
  steps:
    - name: Clone repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Configure gitsign
      uses: chainguard-dev/actions/setup-gitsign@fabe4ed3f66ceb5f8ec86ed7ae6d0c945ca362fb # v1.6.28

    - name: Install The Latest Release Version of Zarf
      uses: zarf-dev/setup-zarf@10e539efed02f75ec39eb8823e22a5c795f492ae # v1.0.1

    - name: Update checksum
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      if: ${{ !startsWith(github.ref, 'refs/heads/renovate/') }}
      run: |-
        ./.github/hack/zarf.sh

    - name: Commit & Push changes
      uses: actions-js/push@5a7cbd780d82c0c937b5977586e641b2fd94acc5 # v1.5
      with:
        branch: ${{ github.head_ref }}
        message: "chore(resources): updated resources files"
        github_token: ${{ inputs.github_token }}
        author_name: renovate[bot]
        author_email: <29139614+renovate[bot]@users.noreply.github.com>
